plugins {
    id 'groovy'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    // Real Mapepire client SDK (Java, since that's the only JVM client Mapepire publishes -
    // there is no separate Groovy artifact). Coordinates verified against Maven Central
    // (repo1.maven.org/maven2/io/github/mapepire-ibmi/mapepire-sdk/) - the
    // DaemonServer/SqlJob/Query/QueryOptions/QueryResult APIs the spec is written against
    // come from this artifact.
    testImplementation 'io.github.mapepire-ibmi:mapepire-sdk:0.1.3'

    testImplementation 'org.apache.groovy:groovy:4.0.33'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        showStandardStreams = true
    }

    // IBMI_HOST / IBMI_PORT / IBMI_USER / IBMI_PASSWORD / IBMI_IGNORE_UNAUTHORIZED (see
    // README) are read straight out of the environment by RpgSubprocedureSpec.groovy at
    // runtime - the forked test JVM inherits them automatically. If you change them in your
    // shell and a Gradle daemon from an earlier run is still alive, stop it first
    // (`gradle --stop`) or pass `--no-daemon`, since a live daemon keeps the environment it
    // originally started with.
}
